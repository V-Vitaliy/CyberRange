# Compute services. Chroma 1.x has no built-in authentication, so it publishes no
# port: the backend reaches it only through chroma-proxy, which requires
# CHROMA_AUTH_TOKEN. SeaweedFS publishes only its S3 gateway, which requires the
# S3 keys; its master, volume and filer ports stay on the Compose network.
# Published ports use COMPUTE_BIND_ADDRESS (default 127.0.0.1); use a private
# interface address for a split deployment.
services:
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: cyberrange_chroma
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - chroma_data:/chroma/chroma

  chroma-proxy:
    image: envoyproxy/envoy:v1.40.2
    container_name: cyberrange_chroma_proxy
    restart: unless-stopped
    depends_on:
      - chromadb
    environment:
      CHROMA_AUTH_TOKEN: ${CHROMA_AUTH_TOKEN:?Set CHROMA_AUTH_TOKEN in .env}
    volumes:
      - ./deploy/envoy-chroma.yaml:/etc/envoy/chroma.template.yaml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$CHROMA_AUTH_TOKEN" in
          *[!A-Za-z0-9_-]*) echo "CHROMA_AUTH_TOKEN may contain only A-Z a-z 0-9 _ -" >&2; exit 1 ;;
        esac
        if [ $${#CHROMA_AUTH_TOKEN} -lt 32 ]; then echo "CHROMA_AUTH_TOKEN must be at least 32 characters" >&2; exit 1; fi
        sed "s/__CHROMA_AUTH_TOKEN__/$$CHROMA_AUTH_TOKEN/" /etc/envoy/chroma.template.yaml > /tmp/chroma.yaml
        exec envoy -c /tmp/chroma.yaml --log-level warn
    ports:
      - "${COMPUTE_BIND_ADDRESS:-127.0.0.1}:8000:8000"

  # S3-compatible storage for lab uploads. The only S3 identity is the backend,
  # limited to read, write and list on its bucket; anonymous requests are denied.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    container_name: cyberrange_seaweedfs
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-lab-uploads}
    volumes:
      - seaweedfs_data:/data
      - ./deploy/seaweedfs-s3.json:/etc/seaweedfs/s3.template.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for value in "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          case "$$value" in *[!A-Za-z0-9]*) echo "S3 keys may contain only A-Z a-z 0-9" >&2; exit 1 ;; esac
          if [ $${#value} -lt 16 ]; then echo "S3 keys must be at least 16 characters" >&2; exit 1; fi
        done
        case "$$S3_BUCKET" in *[!a-z0-9-]*) echo "S3_BUCKET may contain only a-z 0-9 -" >&2; exit 1 ;; esac
        sed -e "s/__S3_ACCESS_KEY__/$$S3_ACCESS_KEY/" -e "s/__S3_SECRET_KEY__/$$S3_SECRET_KEY/" \
          -e "s/__S3_BUCKET__/$$S3_BUCKET/g" /etc/seaweedfs/s3.template.json > /tmp/s3.json
        exec weed server -dir=/data -master.volumeSizeLimitMB=1024 \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "${COMPUTE_BIND_ADDRESS:-127.0.0.1}:8333:8333"

  # One-shot: creates the uploads bucket; the backend identity cannot create buckets.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.51
    container_name: cyberrange_seaweedfs_init
    depends_on:
      - seaweedfs
    environment:
      S3_BUCKET: ${S3_BUCKET:-lab-uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        shell() { echo "$$1" | timeout 20 weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 2>&1; }
        for _ in $$(seq 60); do
          if shell "s3.bucket.list" > /tmp/buckets && ! grep -qi "error" /tmp/buckets; then break; fi
          sleep 2
        done
        grep -qw "$$S3_BUCKET" /tmp/buckets || shell "s3.bucket.create -name $$S3_BUCKET"
        shell "s3.bucket.list" | grep -qw "$$S3_BUCKET" || { echo "bucket $$S3_BUCKET was not created" >&2; exit 1; }
        echo "bucket $$S3_BUCKET ready"

  # Local mail sink for the agent's send_email tool: captures every message,
  # delivers nothing outside. Web UI on port 8025.
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: cyberrange_mailpit
    restart: unless-stopped
    ports:
      - "${COMPUTE_BIND_ADDRESS:-127.0.0.1}:1025:1025"
      - "${COMPUTE_BIND_ADDRESS:-127.0.0.1}:8025:8025"

volumes:
  chroma_data:
    name: cyberrange_chroma_data
  seaweedfs_data:
    name: cyberrange_seaweedfs_data
