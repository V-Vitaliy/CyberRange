# Compute services. Chroma 1.x has no built-in authentication: it must only be
# reachable by the backend. The port is published on COMPUTE_BIND_ADDRESS
# (default 127.0.0.1); use a private interface address for a split deployment.
services:
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: cyberrange_chroma
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "${COMPUTE_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  chroma_data:
    name: cyberrange_chroma_data
