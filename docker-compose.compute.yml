version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: cyberrange_chroma
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma


volumes:
  chroma_data:
    name: cyberrange_chroma_data