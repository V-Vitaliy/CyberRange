name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Run isolated backend tests
        env:
          PYTHONPATH: backend
          GROQ_API_KEY: ''
          LANGSMITH_TRACING: 'false'
        run: python -m pytest -q -ra backend/tests

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyberrange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cyberrange_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      GROQ_API_KEY: ''
      LANGSMITH_TRACING: 'false'
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cyberrange_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      # Each check imports application settings once, so they run as separate processes.
      - name: PostgreSQL setup check
        env:
          CYBERRANGE_SETUP_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          CYBERRANGE_SETUP_TEST_DATABASE_NAME: cyberrange_test
        # Fail instead of passing silently if the check skips itself.
        run: |
          python backend/tests/integration/test_admin_setup_postgres.py -v 2>&1 | tee result.txt
          ! grep -qi skipped result.txt
      - name: PostgreSQL SQLi isolation check
        env:
          CYBERRANGE_SQLI_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          CYBERRANGE_SQLI_TEST_DATABASE_NAME: cyberrange_test
        # Fail instead of passing silently if the check skips itself.
        run: |
          python backend/tests/integration/test_sqli_isolation_postgres.py -v 2>&1 | tee result.txt
          ! grep -qi skipped result.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/blue-team-api.test.mjs
      - run: npx tsc --noEmit --incremental false
      - name: Build dashboard
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build -- --webpack
