name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Explicit bash enables pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Run isolated backend tests
        env:
          PYTHONPATH: backend
          GROQ_API_KEY: ''
          LANGSMITH_TRACING: 'false'
        run: python -m pytest -q -ra backend/tests

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyberrange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cyberrange_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      GROQ_API_KEY: ''
      LANGSMITH_TRACING: 'false'
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cyberrange_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      # Each check imports application settings once, so they run as separate processes.
      - name: PostgreSQL setup check
        env:
          CYBERRANGE_SETUP_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          CYBERRANGE_SETUP_TEST_DATABASE_NAME: cyberrange_test
        # Fail instead of passing silently if the check skips itself.
        run: |
          python backend/tests/integration/test_admin_setup_postgres.py -v 2>&1 | tee result.txt
          ! grep -qi skipped result.txt
      - name: PostgreSQL SQLi isolation check
        env:
          CYBERRANGE_SQLI_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          CYBERRANGE_SQLI_TEST_DATABASE_NAME: cyberrange_test
        # Fail instead of passing silently if the check skips itself.
        run: |
          python backend/tests/integration/test_sqli_isolation_postgres.py -v 2>&1 | tee result.txt
          ! grep -qi skipped result.txt

      - name: PostgreSQL SOC worker check
        env:
          CYBERRANGE_SOC_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          CYBERRANGE_SOC_TEST_DATABASE_NAME: cyberrange_test
        # Fail instead of passing silently if the check skips itself.
        run: |
          python backend/tests/integration/test_soc_worker_postgres.py -v 2>&1 | tee result.txt
          ! grep -qi skipped result.txt

  compose-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start services with generated credentials
        run: |
          {
            echo "POSTGRES_USER=cyberadmin"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=cyberrange"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "CHROMA_AUTH_TOKEN=$(openssl rand -hex 32)"
            echo "S3_ACCESS_KEY=$(openssl rand -hex 16)"
            echo "S3_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
          docker compose -f docker-compose.state.yml up -d --wait
          docker compose -f docker-compose.compute.yml up -d
          # The bucket init job must finish successfully.
          test "$(docker wait cyberrange_seaweedfs_init)" = 0 || { docker logs cyberrange_seaweedfs_init; exit 1; }
      - name: Services require credentials and listen on loopback only
        run: |
          set -a; . ./.env; set +a
          external=$(hostname -I | awk '{print $1}')
          # Redis rejects unauthenticated commands and accepts the configured password.
          docker exec cyberrange_redis redis-cli ping | grep -q NOAUTH
          docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" cyberrange_redis redis-cli ping | grep -q PONG
          # Chroma is reachable only through the token proxy.
          auth="Authorization: Bearer $CHROMA_AUTH_TOKEN"
          for _ in $(seq 30); do curl -sf -H "$auth" http://127.0.0.1:8000/api/v2/heartbeat && break; sleep 2; done
          curl -sf -H "$auth" http://127.0.0.1:8000/api/v2/heartbeat
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v2/heartbeat)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' \
            http://127.0.0.1:8000/api/v2/heartbeat)" = 403
          test -z "$(docker port cyberrange_chroma)"
          # SeaweedFS publishes only the S3 gateway; anonymous S3 requests are denied.
          test "$(docker port cyberrange_seaweedfs)" = "8333/tcp -> 127.0.0.1:8333"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/lab-uploads)" = 403
          # Published ports are bound to 127.0.0.1, so the host's external address is refused.
          for port in 5432 6379 8000 8333 1025 8025; do
            docker ps --format '{{.Ports}}' | grep -q "127.0.0.1:$port->"
            if timeout 3 bash -c "echo > /dev/tcp/$external/$port" 2>/dev/null; then
              echo "Port $port is reachable on $external"; exit 1
            fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Agent email reaches only the Mailpit sink
        env:
          PYTHONPATH: backend
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_STARTTLS: 'false'
        run: |
          python -m pip install -q pydantic-settings
          python - <<'PY'
          import json, urllib.request
          from app.agents.tools.email_service import EmailService
          assert EmailService.recipient_allowed("student@lab.local")
          assert not EmailService.recipient_allowed("attacker@example.com")
          assert EmailService.send_real_email("student@lab.local", "CI sink check", "hello")
          messages = json.load(urllib.request.urlopen("http://127.0.0.1:8025/api/v1/messages"))["messages"]
          assert [m["To"][0]["Address"] for m in messages] == ["student@lab.local"], messages
          PY
      - name: Backend Chroma client authenticates through the proxy
        run: |
          python -m pip install -q chromadb-client==1.5.9
          set -a; . ./.env; set +a
          python - <<'PY'
          import os
          import chromadb
          from chromadb.config import Settings
          settings = Settings(
              chroma_client_auth_provider="chromadb.auth.token_authn.TokenAuthClientProvider",
              chroma_client_auth_credentials=os.environ["CHROMA_AUTH_TOKEN"],
          )
          collection = chromadb.HttpClient(host="127.0.0.1", port=8000, settings=settings).get_or_create_collection("ci-proxy-check")
          collection.add(ids=["1"], embeddings=[[0.1, 0.2]], documents=["ci"])
          assert collection.count() == 1
          try:
              chromadb.HttpClient(host="127.0.0.1", port=8000).heartbeat()
          except Exception:
              pass
          else:
              raise AssertionError("Chroma accepted a client without a token")
          PY
      - name: Backend object store is limited to its bucket
        env:
          PYTHONPATH: backend
        run: |
          python -m pip install -q boto3 fastapi
          set -a; . ./.env; set +a
          python - <<'PY'
          import asyncio
          import boto3
          from botocore import UNSIGNED
          from botocore.config import Config
          from app.documents.object_store import ObjectStore, resolve_upload_target

          store = ObjectStore.from_settings()
          key = resolve_upload_target("00000000-0000-0000-0000-000000000001", "../student_uploads/ci.pdf").key
          asyncio.run(store.put(key, b"%PDF-ci"))
          assert asyncio.run(store.get(key)) == b"%PDF-ci"

          def denied(call):
              try:
                  call()
              except Exception:
                  return True
              return False

          assert denied(lambda: store.client.create_bucket(Bucket="ci-other-bucket")), "backend created a bucket"
          anonymous = boto3.client(
              "s3", endpoint_url="http://127.0.0.1:8333", region_name="us-east-1",
              config=Config(signature_version=UNSIGNED),
          )
          assert denied(lambda: anonymous.get_object(Bucket=store.bucket, Key=key)), "anonymous read allowed"
          wrong = boto3.client(
              "s3", endpoint_url="http://127.0.0.1:8333", region_name="us-east-1",
              aws_access_key_id="wrongkey0000000000", aws_secret_access_key="wrong",
          )
          assert denied(lambda: wrong.get_object(Bucket=store.bucket, Key=key)), "wrong key allowed"
          PY
      - name: Compose refuses to start without credentials
        run: |
          rm .env
          ! docker compose -f docker-compose.state.yml config 2>/dev/null
          ! docker compose -f docker-compose.compute.yml config 2>/dev/null
          ! CHROMA_AUTH_TOKEN=set docker compose -f docker-compose.compute.yml config 2>/dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/blue-team-api.test.mjs
      - run: npx tsc --noEmit --incremental false
      - name: Build dashboard
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build -- --webpack
